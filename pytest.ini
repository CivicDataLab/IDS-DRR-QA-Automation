[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Console output options
console_output_style = progress
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --html=reports/report.html
    --self-contained-html
    # Uncomment below for JSON reports (optional)
    # --json-report
    # --json-report-file=reports/report.json

# Parallel execution configuration
# Uncomment and modify the line below to set default parallel workers
# Use: pytest -n auto (auto-detect CPUs)
# Use: pytest -n 4 (run with 4 workers)
# Use: pytest -n 2 (run with 2 workers)
# dist = loadscope  # Distribute tests by scope (class/module)

# Markers for organizing tests
markers =
    smoke: Quick smoke tests for critical functionality
    analytics: Tests for analytics page functionality
    dataset: Tests for dataset page functionality
    component: Component visibility tests
    flow: End-to-end user flow tests
    slow: Tests that take longer to execute
    edge_case: Edge case and boundary condition tests
    negative: Negative test cases
    boundary: Boundary condition tests
    parallel: Tests safe to run in parallel
    serial: Tests that must run serially
    map: Tests for map-based analytics indicators
    multistate: Multi-state testing framework tests
    section_coverage: Tests for section indicator coverage
    cross_state: Cross-state comparison tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File logging for debugging
log_file = reports/test_execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (in seconds)
# Requires pytest-timeout plugin
# timeout = 300

# Rerun failures (requires pytest-rerunfailures)
# Automatically rerun failed tests up to 2 times
# reruns = 2
# reruns_delay = 1
