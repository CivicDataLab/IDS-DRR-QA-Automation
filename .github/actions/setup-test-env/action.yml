name: Setup Test Environment
description: Install Python + deps, restore driver cache, and prepare report directories. Caller must run actions/checkout first — local composite actions cannot self-checkout.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Cache browser drivers
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/selenium
          ~/.wdm
        key: ${{ runner.os }}-drivers-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-drivers-

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Prepare report directories
      shell: bash
      run: mkdir -p reports/self_healing reports/multistate screenshots
