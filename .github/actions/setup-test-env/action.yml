name: Setup Test Environment
description: Install Python + deps via uv, restore driver and locator caches, and prepare report directories. Caller must run actions/checkout first — local composite actions cannot self-checkout.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "requirements.txt"

    - name: Cache browser drivers
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/selenium
          ~/.wdm
        key: ${{ runner.os }}-drivers-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-drivers-

    - name: Cache learned locators
      uses: actions/cache@v4
      with:
        path: config/learned_locators.json
        key: ${{ runner.os }}-learned-locators
        restore-keys: ${{ runner.os }}-learned-locators

    - name: Cache test durations
      uses: actions/cache@v4
      with:
        path: .test_durations
        key: ${{ runner.os }}-test-durations
        restore-keys: ${{ runner.os }}-test-durations

    - name: Install dependencies
      shell: bash
      run: uv pip install -r requirements.txt --system

    - name: Prepare report directories
      shell: bash
      run: mkdir -p reports/self_healing reports/multistate screenshots
