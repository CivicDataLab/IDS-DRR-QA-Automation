name: QA Test Automation

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  deployment:

  # Trigger from external repos (e.g., frontend deployment)
  repository_dispatch:
    types: [frontend-deployed, run-e2e-tests]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to test'
        required: false
        default: 'dev'
        type: choice
        options: ['dev', 'staging', 'prod']
      workers:
        description: 'Parallel workers (1-4)'
        required: false
        default: '3'
        type: choice
        options: ['1', '2', '3', '4']
      test_marker:
        description: 'Test marker (smoke, analytics, dataset)'
        required: false
        type: string

env:
  PYTHON_VERSION: '3.11'
  PARALLEL_WORKERS: 3

jobs:
  # First job: Determine which environment we're testing
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env-config.outputs.environment }}
      run_full_suite: ${{ steps.env-config.outputs.run_full_suite }}
    steps:
      - name: Determine target environment
        id: env-config
        run: |
          # Priority: repository_dispatch payload > workflow_dispatch input > default
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            ENV="${{ github.event.client_payload.environment }}"
            COMMIT="${{ github.event.client_payload.commit }}"
            echo "Triggered by repository_dispatch from frontend"
            echo "Frontend commit: $COMMIT"
          else
            ENV="${{ inputs.environment }}"
          fi

          # Default to dev if not specified
          ENV="${ENV:-dev}"
          echo "environment=$ENV" >> $GITHUB_OUTPUT

          # Determine if we should run full suite (prod/staging/main) or smoke only (dev)
          if [ "$ENV" == "prod" ] || [ "$ENV" == "staging" ] || [ "$ENV" == "main" ]; then
            echo "run_full_suite=true" >> $GITHUB_OUTPUT
            echo "Environment: $ENV → Running FULL test suite"
          else
            echo "run_full_suite=false" >> $GITHUB_OUTPUT
            echo "Environment: $ENV → Running SMOKE tests only"
          fi

  # Full test suite - only for prod/staging/main
  test:
    name: Tests (Shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.run_full_suite == 'true' || github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache browser drivers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/selenium
            ~/.wdm
          key: ${{ runner.os }}-drivers-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-drivers-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # Environment-based URL selection
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
          URL: ${{ secrets.URL }}
          DEV_URL: ${{ secrets.DEV_URL }}
          # STAGING_URL: ${{ secrets.STAGING_URL }}  # Uncomment when staging secret is added
          HOME_URL_4: ${{ secrets.HOME_URL_4 }}
          MEDIUM_URL: ${{ secrets.MEDIUM_URL }}

          # Authentication
          HOME_URL_USERNAME: ${{ secrets.HOME_URL_USERNAME }}
          HOME_URL_PASSWORD: ${{ secrets.HOME_URL_PASSWORD }}

          # Browser Settings
          HEADLESS: true
          BROWSER: chrome
          LOCAL: true

          # Timeout Settings (optimized for CI)
          DEFAULT_TIMEOUT: 10
          SHORT_TIMEOUT: 5
          LONG_TIMEOUT: 15
        run: |
          mkdir -p reports/self_healing

          # Select URL based on target environment
          case "$TARGET_ENV" in
            prod)
              export TEST_URL="${URL}"
              ;;
            staging)
              export TEST_URL="${STAGING_URL:-$URL}"
              ;;
            dev|*)
              export TEST_URL="${DEV_URL:-$URL}"
              ;;
          esac
          echo "Testing against: $TARGET_ENV environment"

          WORKERS=${{ github.event_name == 'workflow_dispatch' && inputs.workers || env.PARALLEL_WORKERS }}
          MARKER=${{ github.event_name == 'workflow_dispatch' && inputs.test_marker != '' && format('-m {0}', inputs.test_marker) || '' }}

          pytest tests/ \
            -n $WORKERS \
            --dist loadscope \
            --reruns 2 \
            --reruns-delay 1 \
            --html=reports/test_report_shard_${{ matrix.shard }}.html \
            --self-contained-html \
            --junitxml=reports/junit_shard_${{ matrix.shard }}.xml \
            --splits 3 \
            --group ${{ matrix.shard }} \
            $MARKER || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-shard-${{ matrix.shard }}
          path: |
            reports/*.html
            reports/*.xml
            reports/*.log
            reports/self_healing/
          retention-days: 30

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-shard-${{ matrix.shard }}
          path: |
            screenshots/
            reports/screenshots/
          retention-days: 14
          if-no-files-found: ignore

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [setup, test]
    if: always() && needs.test.result != 'skipped'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pytest-html for report merging
        run: pip install pytest-html pytest-metadata

      - uses: actions/download-artifact@v4
        with:
          pattern: test-reports-shard-*
          path: reports
          merge-multiple: true

      - name: Merge test reports into single pytest-html report
        run: |
          # Use the merge script to generate a single consolidated pytest-html report
          # This merges all JUnit XML files from shards and creates report.html
          python3 scripts/merge_test_reports.py

      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-test-report
          path: reports/report.html
          retention-days: 30

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: reports/**/*.xml
          check_name: Test Results

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Test Results\n\n- Execution: 3 parallel shards (${process.env.PARALLEL_WORKERS} workers each)\n- Report Format: Single consolidated pytest-html report\n\n📊 Download the **consolidated-test-report** artifact to view \`report.html\`\n\nThe consolidated report merges all test results from parallel shards into a single pytest-html format report (same as local runs).`
            });

  # Smoke tests - for dev environment OR push/PR events
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: setup
    # Run for: dev env from frontend, OR local push/PR events
    if: |
      needs.setup.outputs.run_full_suite == 'false' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        env:
          # Environment-based URL selection
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
          URL: ${{ secrets.URL }}
          DEV_URL: ${{ secrets.DEV_URL }}
          HOME_URL_4: ${{ secrets.HOME_URL_4 }}
          MEDIUM_URL: ${{ secrets.MEDIUM_URL }}

          # Authentication
          HOME_URL_USERNAME: ${{ secrets.HOME_URL_USERNAME }}
          HOME_URL_PASSWORD: ${{ secrets.HOME_URL_PASSWORD }}

          # Browser Settings
          HEADLESS: true
          BROWSER: chrome
          LOCAL: true

          # Timeout Settings
          DEFAULT_TIMEOUT: 10
          SHORT_TIMEOUT: 5
          LONG_TIMEOUT: 15
        run: |
          # Use DEV_URL for smoke tests
          export TEST_URL="${DEV_URL:-$URL}"
          echo "Running smoke tests against: $TARGET_ENV environment"
          pytest tests/ -n 4 -m smoke --html=reports/smoke_report.html --self-contained-html || true

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: reports/smoke_report.html
          retention-days: 7

  multistate-test:
    name: Multi-State Analytics Tests
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml  # Ensure YAML support for state configs

      - name: Check if state configs exist
        id: check_configs
        run: |
          if [ -d "config/states" ] && [ -f "config/states/states_master.yaml" ]; then
            echo "configs_exist=true" >> $GITHUB_OUTPUT
          else
            echo "configs_exist=false" >> $GITHUB_OUTPUT
          fi

      - name: Run state discovery
        if: steps.check_configs.outputs.configs_exist == 'false'
        env:
          URL: ${{ secrets.URL }}
          DEV_URL: ${{ secrets.DEV_URL }}
          HOME_URL_USERNAME: ${{ secrets.HOME_URL_USERNAME }}
          HOME_URL_PASSWORD: ${{ secrets.HOME_URL_PASSWORD }}
          HEADLESS: true
          DEFAULT_TIMEOUT: 10
        run: |
          echo "State configs not found, running discovery..."
          python scripts/discover_state_indicators.py || echo "Discovery failed, will use fallback"

      - name: Run multi-state tests
        env:
          # Application URLs (DEV_URL takes precedence if set)
          URL: ${{ secrets.URL }}
          DEV_URL: ${{ secrets.DEV_URL }}
          HOME_URL_4: ${{ secrets.HOME_URL_4 }}
          MEDIUM_URL: ${{ secrets.MEDIUM_URL }}

          # Authentication
          HOME_URL_USERNAME: ${{ secrets.HOME_URL_USERNAME }}
          HOME_URL_PASSWORD: ${{ secrets.HOME_URL_PASSWORD }}

          # Browser Settings
          HEADLESS: true
          BROWSER: chrome
          LOCAL: true

          # Timeout Settings
          DEFAULT_TIMEOUT: 10
          SHORT_TIMEOUT: 5
          LONG_TIMEOUT: 15
        run: |
          mkdir -p reports/multistate

          # Run multi-state tests with parallel execution
          pytest tests/test_analytics.py \
            -v \
            -n 4 \
            --html=reports/multistate_test_report.html \
            --self-contained-html \
            --junitxml=reports/multistate_junit.xml \
            -m multistate || true

      - name: Upload multi-state reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multistate-test-reports
          path: |
            reports/multistate/
            reports/multistate_test_report.html
            reports/multistate_junit.xml
            config/states/
          retention-days: 30

      - name: Upload multi-state screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multistate-screenshots
          path: screenshots/analytics/
          retention-days: 14
          if-no-files-found: ignore
