name: Push to Main — Full Regression

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  regression:
    uses: ./.github/workflows/_test.yml
    with:
      markers: ""
      shards: "[1,2,3,4,5,6,7,8]"
      workers: 2
      # TEMPORARY: dev, not prod, until the production move (week of 2026-09-14).
      # prod currently serves only Assam - bihar, uttar-pradesh, odisha and
      # himachal-pradesh all 404 there - while every multistate test parametrizes
      # all five, so a prod run is guaranteed ~4/5 red for reasons unrelated to
      # the code under test (#43). Pointing at dev keeps this signal meaningful.
      # Revert to prod once prod matches dev, and re-verify the suite there.
      target_env: dev
      bootstrap_states: true
    secrets: inherit
