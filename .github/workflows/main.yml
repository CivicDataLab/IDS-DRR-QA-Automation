name: Push to Main — Full Regression

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  regression:
    uses: ./.github/workflows/_test.yml
    with:
      markers: ""
      shards: "[1,2,3,4]"
      workers: 4
      target_env: prod
      bootstrap_states: true
    secrets: inherit
